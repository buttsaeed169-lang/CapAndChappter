<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saeed Cap Hub | Used Caps, Books & Novels</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#eef2f6;--card:#fff;--red:#c8372d;--gold:#e0a526;--mute:#5b6577;--line:#d9e0e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f5fa;--paper:#0f1626;--card:#18223a;--mute:#9aa6bd;--line:#2a3654}}
:root[data-theme="dark"]{--ink:#f2f5fa;--paper:#0f1626;--card:#18223a;--mute:#9aa6bd;--line:#2a3654}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Bricolage Grotesque',system-ui,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:46px;height:46px;flex:none}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
.brand small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:3px}
.bagbtn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:9px 16px;font-weight:600}
.bagbtn span{background:var(--gold);color:#14213d;border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:800}
.hero{max-width:1120px;margin:auto;padding:48px 20px 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:-2px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--mute);margin:16px 0 22px;max-width:46ch;font-size:18px}
.hero svg{width:100%;max-width:340px;justify-self:center}
.search{display:flex;max-width:440px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.search input{flex:1;border:0;padding:12px 18px;font:inherit;background:transparent;color:var(--ink);outline:none;min-width:0}
.search button{border:0;background:var(--ink);color:var(--paper);padding:0 20px;font-weight:600}
.tabs{max-width:1120px;margin:20px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.grid{max-width:1120px;margin:20px auto 60px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;display:grid;place-items:center;font-size:64px}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:17px;line-height:1.2}
.info p{font-size:14px;color:var(--mute);flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-weight:800;font-size:18px}
.add{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600}
.add:disabled{background:var(--line);color:var(--mute);cursor:default}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--mute);font-size:14px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
.veil.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--card);z-index:40;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh button{background:none;border:0;font-size:26px;color:var(--ink)}
.lines{flex:1;overflow-y:auto}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .e{font-size:28px}
.line div{flex:1}
.line small{color:var(--mute)}
.line button{background:none;border:0;color:var(--red);font-weight:600}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:20px;padding:14px 0}
.go{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px}
.fld{width:100%;padding:11px 12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--paper);color:var(--ink)}
.done{text-align:center;padding:40px 10px}
.done .e{font-size:56px}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:28px}.hero svg{max-width:220px;order:-1}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>
<header><div class="bar">
<a class="brand" href="#top" aria-label="Saeed Cap Hub home">
<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#14213d"/><circle cx="32" cy="32" r="27" fill="none" stroke="#e0a526" stroke-width="1.5"/>
<path d="M13 35c0-11 8-18 19-18s19 7 19 18z" fill="#c8372d"/><path d="M32 17v18" stroke="#14213d" stroke-width="1.5"/><circle cx="32" cy="16" r="2.5" fill="#e0a526"/>
<path d="M11 35h42c3 0 6 1.5 7 4H4c1-2.500 4-4 7-4z" fill="#e0a526"/>
<path d="M14 43h17v9c-6-2-11-2-17 0zM50 43H33v9c6-2 11-2 17 0z" fill="#fff"/><path d="M32 43v9" stroke="#14213d" stroke-width="1.5"/></svg>
<span><b>Saeed Cap Hub</b><small>Used caps, books &amp; novels</small></span></a>
<button class="bagbtn" id="open">Bag<span id="count">0</span></button>
</div></header>

<main id="top">
<section class="hero">
<div>
<h1>Pre-loved caps. <em>Well-read</em> books.</h1>
<p>Hand-picked used caps, study books and novels at honest prices. Every piece is one of a kind, so when it's gone, it's gone.</p>
<div class="search"><input id="q" type="search" placeholder="Search caps, books, novels" aria-label="Search"><button id="sb">Search</button></div>
</div>
<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#14213d"/><circle cx="32" cy="32" r="27" fill="none" stroke="#e0a526" stroke-width="1.5"/>
<path d="M13 35c0-11 8-18 19-18s19 7 19 18z" fill="#c8372d"/><path d="M32 17v18" stroke="#14213d" stroke-width="1.5"/><circle cx="32" cy="16" r="2.5" fill="#e0a526"/>
<path d="M11 35h42c3 0 6 1.5 7 4H4c1-2.500 4-4 7-4z" fill="#e0a526"/>
<path d="M14 43h17v9c-6-2-11-2-17 0zM50 43H33v9c6-2 11-2 17 0z" fill="#fff"/><path d="M32 43v9" stroke="#14213d" stroke-width="1.5"/></svg>
</section>

<div class="tabs" id="tabs">
<button class="tab" data-c="all" aria-pressed="true">All</button>
<button class="tab" data-c="caps" aria-pressed="false">Caps</button>
<button class="tab" data-c="books" aria-pressed="false">Books</button>
<button class="tab" data-c="novels" aria-pressed="false">Novels</button>
</div>
<div class="grid" id="grid"></div>
</main>
<footer>Saeed Cap Hub &middot; Pay on delivery across Pakistan &middot; WhatsApp to confirm your order</footer>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="Your bag">
<div class="dh"><h2>Your bag</h2><button id="close" aria-label="Close bag">&times;</button></div>
<div class="lines" id="lines"></div>
<div id="foot"></div>
</aside>

<script>
var P=[
{id:1,n:"Navy Baseball Cap",c:"caps",p:850,e:"🧢",d:"Washed cotton, adjustable strap",bg:"#dbe6f5"},
{id:2,n:"Vintage Corduroy Snapback",c:"caps",p:1200,e:"🧢",d:"Brown, light wear on the brim",bg:"#f1dfc8"},
{id:3,n:"Black Cap, Embroidered",c:"caps",p:700,e:"🧢",d:"Good condition, no stains",bg:"#e2e2e8"},
{id:4,n:"Red Sports Cap",c:"caps",p:600,e:"🧢",d:"Breathable mesh back",bg:"#f6d9d6"},
{id:5,n:"The Great Gatsby",c:"novels",p:450,e:"📖",d:"F. Scott Fitzgerald. Like new",bg:"#f3ead0"},
{id:6,n:"To Kill a Mockingbird",c:"novels",p:400,e:"📖",d:"Harper Lee. Well read, clean pages",bg:"#e5efe0"},
{id:7,n:"Dune",c:"novels",p:900,e:"📖",d:"Frank Herbert. Hardcover",bg:"#f1dfc8"},
{id:8,n:"The Alchemist",c:"novels",p:350,e:"📖",d:"Paulo Coelho. Paperback",bg:"#f6ecd0"},
{id:9,n:"Introduction to Algorithms",c:"books",p:2500,e:"📚",d:"Some highlighting inside",bg:"#dbe6f5"},
{id:10,n:"Sapiens",c:"books",p:800,e:"📚",d:"Yuval Noah Harari. Good condition",bg:"#e5efe0"},
{id:11,n:"Atomic Habits",c:"books",p:650,e:"📚",d:"James Clear. Minor cover wear",bg:"#f6d9d6"},
{id:12,n:"Class 12 Physics Notes Book",c:"books",p:500,e:"📚",d:"Study guide, pages intact",bg:"#e2e2e8"}
];
var cat="all",bag=[],$=function(i){return document.getElementById(i)};
function rs(n){return"Rs "+n.toLocaleString("en-PK")}
function render(){
var q=$("q").value.toLowerCase().trim(),g=$("grid"),L=P.filter(function(x){return(cat=="all"||x.c==cat)&&x.n.toLowerCase().indexOf(q)>-1});
g.innerHTML=L.length?"":'<p class="empty">Nothing matches. Try another word or category.</p>';
L.forEach(function(x){var s=bag.indexOf(x.id)>-1,a=document.createElement("article");a.className="item";
a.innerHTML='<div class="pic" style="background:'+x.bg+'">'+x.e+'</div><div class="info"><h3>'+x.n+'</h3><p>'+x.d+'</p><div class="row"><span class="price">'+rs(x.p)+'</span><button class="add" '+(s?"disabled":"")+' data-id="'+x.id+'">'+(s?"In bag":"Add to bag")+'</button></div></div>';
g.appendChild(a)})}
function drawer(){
var T=0;$("count").textContent=bag.length;
$("lines").innerHTML=bag.length?"":'<p class="empty">Your bag is empty. Add a cap or a book to start.</p>';
bag.forEach(function(id){var x=P.filter(function(y){return y.id==id})[0];T+=x.p;var d=document.createElement("div");d.className="line";
d.innerHTML='<span class="e">'+x.e+'</span><div><b>'+x.n+'</b><br><small>'+rs(x.p)+'</small></div><button data-rm="'+id+'">Remove</button>';$("lines").appendChild(d)});
$("foot").innerHTML=bag.length?'<div class="tot"><span>Total</span><span>'+rs(T)+'</span></div><input class="fld" id="nm" placeholder="Full name"><input class="fld" id="ph" placeholder="Phone number"><input class="fld" id="ad" placeholder="Delivery address"><button class="go" id="order">Place order</button>':""}
function show(o){$("drawer").classList.toggle("on",o);$("veil").classList.toggle("on",o)}
$("open").onclick=function(){show(true)};$("close").onclick=$("veil").onclick=function(){show(false)};
$("q").oninput=$("sb").onclick=render;
$("tabs").onclick=function(e){var c=e.target.dataset.c;if(!c)return;cat=c;[].forEach.call(document.querySelectorAll(".tab"),function(t){t.setAttribute("aria-pressed",t.dataset.c==c)});render()};
$("grid").onclick=function(e){var id=+e.target.dataset.id;if(!id)return;bag.push(id);render();drawer()};
$("lines").onclick=function(e){var id=+e.target.dataset.rm;if(!id)return;bag=bag.filter(function(x){return x!=id});render();drawer()};
$("foot").onclick=function(e){if(e.target.id!="order")return;
if(!$("nm").value||!$("ph").value||!$("ad").value){$("nm").focus();e.target.textContent="Fill name, phone and address";return}
var n=bag.length;bag=[];render();$("count").textContent=0;$("lines").innerHTML='<div class="done"><div class="e">✅</div><h3>Order placed</h3><p>'+n+' item'+(n>1?"s":"")+' on the way. We will call you to confirm.</p></div>';$("foot").innerHTML=""};
render();drawer();
</script>
</body>
</html>
